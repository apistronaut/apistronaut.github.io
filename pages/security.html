<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>$$$</title>
        <style>
            :root {
                --color-primary: #925bb4;
                --color-secondary: #b3894f;
                --color-white: #faf6f1;
                --color-black: #2c2420;
                --color-background: #f5e6d3;
                --color-text: #4a3c32;
                --max-width: 800px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: helvetica, sans-serif;
                line-height: 1.6;
                background-color: var(--color-background);
                color: var(--color-text);
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                padding: 0 15px;
            }

            .container {
                width: 100%;
                max-width: var(--max-width);
                margin: 0 auto;
                padding: 20px 0;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 0;
                border-bottom: 2px solid var(--color-secondary);
            }

            .site-title {
                font-size: 1.8rem;
                font-weight: 700;
                color: var(--color-primary);
                letter-spacing: 1px;
            }

            .hamburger {
                cursor: pointer;
                font-size: 24px;
                background: none;
                border: none;
                color: var(--color-black);
                transition: transform 0.3s ease;
            }

            .hamburger:hover {
                transform: scale(1.1);
            }

            .hamburger.active {
                transform: rotate(45deg);
            }

            .side-menu {
                position: fixed;
                top: 0;
                right: -300px;
                width: 250px;
                height: 100vh;
                background-color: var(--color-white);
                box-shadow: -4px 0 15px rgba(44, 36, 32, 0.1);
                transition: right 0.3s ease;
                z-index: 1000;
                padding: 20px;
            }

            .side-menu.active {
                right: 0;
            }

            .side-menu-content {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin-top: 50px;
            }

            .side-menu-item {
                background-color: var(--color-background);
                padding: 10px 15px;
                border-radius: 8px;
                text-decoration: none;
                color: var(--color-primary);
                font-weight: 600;
                text-align: center;
                transition: background-color 0.3s ease;
                color: #925bb4;
            }

            .side-menu-item:hover {
                background-color: var(--color-primary);
                color: var(--color-white);
            }

            .article {
                background-color: var(--color-white);
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(44, 36, 32, 0.1);
                margin-top: 20px;
            }

            .article-title {
                font-size: 2rem;
                color: var(--color-primary);
                margin-bottom: 20px;
                border-bottom: 2px solid var(--color-secondary);
                padding-bottom: 10px;
            }

            .article-meta {
                display: flex;
                justify-content: space-between;
                color: var(--color-secondary);
                font-size: 0.9rem;
                margin-bottom: 20px;
            }

            .article-content {
                font-size: 1.1rem;
            }

            .article-content p {
                margin-bottom: 15px;
            }

            .article-content h2 {
                color: var(--color-primary);
                margin: 25px 0 15px;
                border-bottom: 1px solid var(--color-secondary);
                padding-bottom: 5px;
            }

            @media (max-width: 600px) {
                .container {
                    padding: 10px;
                }

                .article {
                    padding: 20px;
                }

                .article-title {
                    font-size: 1.6rem;
                }

                .article-content {
                    font-size: 1rem;
                }
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(44, 36, 32, 0.5);
                display: none;
                z-index: 999;
            }

            .overlay.active {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="overlay" id="overlay"></div>

        <div class="container">
            <div class="header">
                <div class="site-title">$$$</div>
                <button class="hamburger" id="hamburger">&#9776;</button>
            </div>

            <div class="side-menu" id="side-menu">
                <div class="side-menu-content">
                    <a href="../index.html" class="side-menu-item">Home</a>
                    <a href="automation.html" class="side-menu-item"
                        >Automation</a
                    >
                    <a href="security.html" class="side-menu-item">Security</a>
                    <a href="drones.html" class="side-menu-item">Drones</a>
                    <a href="about.html" class="side-menu-item">About</a>
                </div>
            </div>

            <div class="article">
                <h1 class="article-title">$$$</h1>

                <div class="article-meta">
                    <span>Date: $$$</span>
                    <span>Series: $$$</span>
                </div>

                <div class="article-content">
                    <p>$$$</p>

                    <h2>$$$</h2>
                    <p>$$$</p>
                </div>
            </div>
        </div>

        <script>
            const hamburger = document.getElementById("hamburger");
            const sideMenu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");

            hamburger.addEventListener("click", () => {
                hamburger.classList.toggle("active");
                sideMenu.classList.toggle("active");
                overlay.classList.toggle("active");
            });

            overlay.addEventListener("click", () => {
                hamburger.classList.remove("active");
                sideMenu.classList.remove("active");
                overlay.classList.remove("active");
            });
        </script>
    </body>
</html>
