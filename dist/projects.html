<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Projects</title><style>body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:url(warm.webp) center/cover no-repeat fixed;font-family:Helvetica,sans-serif;overflow:hidden}.explore-text{font-size:clamp(1rem,10vw,3rem);color:#fff0;text-shadow:2px 2px 4px rgba(0,0,0,.5);animation:fadeIn 2.5s ease-out forwards;animation-delay:.5s;opacity:0;animation-fill-mode:forwards;text-decoration:none}.hover-envelope{position:relative;transition:color .3s ease;color:purple;text-shadow:none}.hover-envelope:before{content:"";position:absolute;inset:-2px -5px;background-color:#fff;border-radius:30px;transform:scale(.95);opacity:.8;transition:all .3s ease;z-index:-1}.hover-envelope:hover:before{transform:scale(1.1);opacity:1}@keyframes fadeIn{0%{opacity:0;color:#fff0;text-shadow:2px 2px 4px rgba(0,0,0,0)}to{opacity:1;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.5)}}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#0000004d;z-index:-1}header{position:relative;height:auto;width:auto;display:flex;justify-content:flex-end;align-items:center;margin:0;box-shadow:none}.hamburger{position:fixed;top:20px;right:20px;cursor:pointer;z-index:100;font-size:36px;background:none;border:none;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:transform .3s ease}.hamburger:hover{transform:scale(1.3)}.hamburger.active{transform:rotate(45deg)}.dynamic-container{position:fixed;top:80px;right:20px;width:250px;display:flex;flex-direction:column;gap:15px;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;transform:translateY(-20px)}.dynamic-container.active{opacity:1;pointer-events:auto;transform:translateY(0)}.dynamic-item{background:#ffffffe6;border-radius:30px;padding:12px 20px;text-align:center;box-shadow:0 8px 15px #0000001a;opacity:0;transform:translate(20px);transition:opacity .8s ease,transform .8s ease,background .3s ease}.dynamic-item:hover{background:#fff;box-shadow:0 10px 20px #00000026}.dynamic-item.active{opacity:1;transform:translate(0)}.dynamic-item a{text-decoration:none;color:#925bb4;font-weight:600;font-size:18px;letter-spacing:.5px;transition:color .3s ease}.dynamic-item a:hover{color:#6a5acd}
</style></head> <body> <div class="overlay"></div> <h1> <a class="explore-text" href="https://github.com/apistronaut">
For now... <span class="hover-envelope">GitHub</span> </a> </h1> <div class="hamburger" id="hamburger">&#9776;</div> <div class="dynamic-container" id="dynamic-container"></div> <script>
            const items = [
                { text: "Home", link: "index.html" },
                { text: "Articles", link: "articles.html" },
                { text: "Projects", link: "projects.html" },
                { text: "About", link: "about.html" },
            ];

            // Wait for elements to be available
            window.addEventListener("load", () => {
                const hamburger = document.getElementById("hamburger");
                const container = document.getElementById("dynamic-container");

                let isActive = false;
                let animationTimeouts = [];

                const clearAnimations = () => {
                    animationTimeouts.forEach((timeout) =>
                        clearTimeout(timeout),
                    );
                    animationTimeouts = [];
                };

                const clearItems = () => {
                    clearAnimations();
                    container.innerHTML = "";
                };

                hamburger.addEventListener("click", () => {
                    clearAnimations();

                    isActive = !isActive;
                    hamburger.classList.toggle("active");

                    if (isActive) {
                        container.innerHTML = "";
                        container.classList.add("active");

                        items.forEach((item, index) => {
                            const div = document.createElement("div");
                            div.className = "dynamic-item";

                            const link = document.createElement("a");
                            link.href = item.link;
                            link.textContent = item.text;

                            div.appendChild(link);
                            container.appendChild(div);

                            const timeout = setTimeout(() => {
                                div.classList.add("active");
                            }, index * 250);

                            animationTimeouts.push(timeout);
                        });
                    } else {
                        const allItems = Array.from(
                            container.querySelectorAll(".dynamic-item"),
                        );

                        if (allItems.length === 0) {
                            container.classList.remove("active");
                            return;
                        }

                        allItems.forEach((item, index) => {
                            const reverseIndex = allItems.length - 1 - index;
                            const timeout = setTimeout(() => {
                                item.classList.remove("active");
                            }, reverseIndex * 250);

                            animationTimeouts.push(timeout);
                        });

                        const finalTimeout = setTimeout(
                            () => {
                                container.classList.remove("active");
                                container.innerHTML = "";
                            },
                            allItems.length * 250 + 100,
                        );

                        animationTimeouts.push(finalTimeout);
                    }
                });
            });
        </script> </body> </html>
